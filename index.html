<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Birthday | Gaurav Bhai</title>
  <style>
    html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
    
    /* बैकग्राउंड: पहले आसमानी, फिर भगवा में ट्रांज़िशन */
    .bg{
      position:fixed;inset:0;z-index:-2;
      background:#87ceeb; /* हल्का आसमानी */
      transition: background-color 3s ease-in-out;
    }
    .bg.saffron{
      background:#ffb84d; /* हल्का भगवा */
    }
    
    canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
    
    /* तारीख/समय */
    .datetime{position:fixed;left:50%;transform:translateX(-50%);text-align:center;user-select:none;color:#0f3057;font-weight:600}
    .date{top:15px;background:rgba(255,255,255,.8);padding:8px 16px;border-radius:12px;backdrop-filter:blur(6px)}
    .time{bottom:15px;font-size:18px;background:rgba(255,255,255,.8);padding:10px 16px;border-radius:12px;backdrop-filter:blur(6px)}
    
    /* 5s स्लाइड इन काउंटडाउन */
    .intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
           animation:slideDown 5s ease-in-out forwards}
    @keyframes slideDown{0%{transform:translateY(-100%)}100%{transform:translateY(0%)}}
    
    .countdown-wrap{width:200px;height:200px;position:relative;display:grid;place-items:center;
                    filter:drop-shadow(0 10px 30px rgba(0,0,0,.2))}
    .cd-number{position:absolute;font-size:72px;font-weight:900;color:#1a5490;text-shadow:2px 2px 0 rgba(255,255,255,.7)}
    
    svg{width:200px;height:200px;transform:rotate(-90deg)}
    .ring-bg{stroke:rgba(255,255,255,.7);stroke-width:12;fill:none}
    .ring-progress{stroke:#4169e1;stroke-width:12;fill:none;stroke-linecap:round;
                   transition:stroke-dashoffset 1s linear}
    
    /* मैसेज */
    .message{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%) scale(.9);max-width:90vw;
             text-align:center;line-height:1.6;padding:20px 24px;border-radius:18px;
             background:rgba(255,255,255,.75);backdrop-filter:blur(10px);font-weight:700;color:#222;
             opacity:0;transition:opacity 1s ease, transform 1s ease}
    .message.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .message .title{font-size:32px;margin-bottom:12px;
                    background:linear-gradient(45deg,#ff1493,#ff6347,#4169e1,#32cd32);
                    -webkit-background-clip:text;background-clip:text;color:transparent}
    .message .sub{font-weight:600;color:#2b4c85;font-size:16px}
    
    /* फुटर */
    footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:12px;
           color:#ff1493;font-weight:700;font-size:16px;
           background:rgba(255,255,255,.6);backdrop-filter:blur(8px)}
    
    /* बॉर्डर */
    .frame{position:fixed;inset:20px;pointer-events:none;
           border:4px dashed rgba(255,20,147,.4);border-radius:20px;
           box-shadow:inset 0 0 0 8px rgba(255,255,255,.4)}
    
    @media (max-width:720px){
      .message .title{font-size:24px}
      .message .sub{font-size:14px}
    }
  </style>
</head>
<body>
  <div class="bg" id="bgColor"></div>
  <canvas id="bubbles"></canvas>
  <canvas id="emojis"></canvas>
  
  <div class="datetime date" id="dateBox"></div>
  <div class="datetime time" id="timeBox"></div>
  
  <!-- काउंटडाउन -->
  <div class="intro" id="intro">
    <div class="countdown-wrap">
      <div class="cd-number" id="cdNum">5</div>
      <svg viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
        <circle class="ring-progress" id="ring" cx="50" cy="50" r="42" 
                stroke-dasharray="263.89" stroke-dashoffset="0"></circle>
      </svg>
    </div>
  </div>
  
  <!-- संदेश -->
  <div class="message" id="wish">
    <div class="title">गौरव भाई, Happy Birthday! 🎉</div>
    <div class="sub">मै विशाल तिवारी आज के शुभ दिन के अवसर पर स्वागत करता हु आज के खास दिन पर मेरी तरफ से ढेर सारा उपहार!</div>
  </div>
  
  <div class="frame"></div>
  <footer>पार्टी के देने के लिए अपने दोस्त से मिले🙃😊</footer>

<script>
/* इंडिया का लाइव समय */ // DOM time updates pattern [web:54]
function updateClock(){
  const now = new Date();
  const opts = {timeZone:'Asia/Kolkata'};
  document.getElementById('dateBox').textContent = 
    new Intl.DateTimeFormat('hi-IN',{...opts,weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(now);
  document.getElementById('timeBox').textContent = 
    new Intl.DateTimeFormat('hi-IN',{...opts,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
}
updateClock(); setInterval(updateClock, 500);

/* पानी-बबल्स बैकग्राउंड */ // canvas animation with rAF
const bubCanvas = document.getElementById('bubbles');
const bctx = bubCanvas.getContext('2d');
let BW, BH, bubbles = [];

function resizeBubbles(){
  BW = bubCanvas.width = window.innerWidth;
  BH = bubCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeBubbles);
resizeBubbles();

function createBubbles(count = 50){
  bubbles = [];
  for(let i = 0; i < count; i++){
    bubbles.push({
      x: Math.random() * BW,
      y: Math.random() * BH,
      radius: 6 + Math.random() * 12,
      speed: 0.3 + Math.random() * 0.7,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.8 + Math.random() * 1.4,
      alpha: 0.4 + Math.random() * 0.6
    });
  }
}
createBubbles();

function animateBubbles(){
  bctx.clearRect(0, 0, BW, BH);
  
  bubbles.forEach(bubble => {
    bubble.sway += 0.008;
    bubble.x += Math.sin(bubble.sway) * bubble.swaySpeed * 0.5;
    bubble.y -= bubble.speed;
    
    if(bubble.y + bubble.radius < -20){
      bubble.y = BH + 20;
      bubble.x = Math.random() * BW;
    }
    
    const gradient = bctx.createRadialGradient(
      bubble.x, bubble.y, bubble.radius * 0.1,
      bubble.x, bubble.y, bubble.radius
    );
    gradient.addColorStop(0, `rgba(255,255,255,${bubble.alpha})`);
    gradient.addColorStop(0.7, `rgba(173,216,230,${bubble.alpha * 0.6})`);
    gradient.addColorStop(1, `rgba(173,216,230,0.1)`);
    
    bctx.fillStyle = gradient;
    bctx.beginPath();
    bctx.arc(bubble.x, bubble.y, bubble.radius, 0, Math.PI * 2);
    bctx.fill();
    
    // हाइलाइट
    bctx.fillStyle = `rgba(255,255,255,${bubble.alpha * 0.8})`;
    bctx.beginPath();
    bctx.arc(bubble.x - bubble.radius * 0.3, bubble.y - bubble.radius * 0.3, bubble.radius * 0.2, 0, Math.PI * 2);
    bctx.fill();
  });
  
  requestAnimationFrame(animateBubbles);
}
requestAnimationFrame(animateBubbles);

/* 5 सेकंड काउंटडाउन */ // circular progress with proper timing [web:54]
const COUNTDOWN_DURATION = 5000; // 5 सेकंड
const ring = document.getElementById('ring');
const cdNumber = document.getElementById('cdNum');
const CIRCUMFERENCE = 2 * Math.PI * 42; // ~263.89

ring.style.strokeDasharray = CIRCUMFERENCE;
ring.style.strokeDashoffset = '0';

let startTime = Date.now();
let lastNumber = 5;

function updateCountdown(){
  const elapsed = Date.now() - startTime;
  const progress = Math.min(elapsed / COUNTDOWN_DURATION, 1);
  
  // रिंग प्रोग्रेस
  const offset = CIRCUMFERENCE * progress;
  ring.style.strokeDashoffset = offset.toString();
  
  // नंबर अपडेट (5, 4, 3, 2, 1)
  const remaining = Math.ceil((1 - progress) * 5);
  if(remaining !== lastNumber && remaining >= 0){
    lastNumber = remaining;
    cdNumber.textContent = remaining === 0 ? '' : remaining.toString();
  }
  
  if(progress < 1){
    requestAnimationFrame(updateCountdown);
  } else {
    finishCountdown();
  }
}
requestAnimationFrame(updateCountdown);

function finishCountdown(){
  // काउंटडाउन छुपाएं
  document.getElementById('intro').style.display = 'none';
  
  // बैकग्राउंड को भगवा में बदलें [web:60]
  setTimeout(() => {
    document.getElementById('bgColor').classList.add('saffron');
  }, 200);
  
  // मैसेज दिखाएं
  setTimeout(() => {
    document.getElementById('wish').classList.add('show');
  }, 800);
  
  // इमोजी लॉन्च करें
  setTimeout(() => {
    launchEmojis();
  }, 1500);
}

/* इमोजी बाउंस एनिमेशन */ // improved emoji canvas rendering [web:53]
const emojiCanvas = document.getElementById('emojis');
const ectx = emojiCanvas.getContext('2d');
let EW, EH;

function resizeEmojis(){
  EW = emojiCanvas.width = window.innerWidth;
  EH = emojiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeEmojis);
resizeEmojis();

const EMOJIS = ['🎂','💐','🥳','🧁','🎊','🎉','🎶','🎵','🎺','👑','💌','
