<!DOCTYPE html><html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Gaurav Bhai 🎉</title>
  <style>
    :root{
      --sky-start: #cfeefd;
      --sky-end: #e6f7ff;
      --bhagwa-start: #fff1e6; /* light bhagwa */
      --bhagwa-end: #ffd7a6;
    }*{box-sizing:border-box}
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  overflow: hidden;
  background: linear-gradient(to bottom, var(--sky-start), var(--sky-end));
  transition: background 2s ease-in-out;
}

/* slide container */
.page-wrap{
  position: relative;
  min-height: 100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding-top:6vh;
}

.card{
  width: min(920px, 95%);
  background: rgba(255,255,255,0.65);
  border-radius: 20px;
  backdrop-filter: blur(6px);
  padding: 28px;
  box-shadow: 0 10px 40px rgba(2,6,23,0.15);
  transform: translateY(-120vh);
  animation: slideDown 5s forwards ease-out;
}

@keyframes slideDown{
  0%{ transform: translateY(-120vh); opacity:0 }
  40%{ opacity:1 }
  100%{ transform: translateY(0); opacity:1 }
}

.top-datetime{ text-align:center; margin-bottom:12px; display:none; }
.top-datetime .date{ font-size:1.05rem; color:#0f172a; font-weight:600 }
.top-datetime .time{ font-size:1.25rem; color:#0f172a; font-weight:800 }

.main-grid{ display:flex; gap:22px; align-items:center; justify-content:space-between; flex-wrap:wrap }

/* countdown */
.countdown-wrap{
  width:180px; height:180px; margin:auto; position:relative;
}
.countdown-wrap svg{ width:100%; height:100%; transform:rotate(-90deg) }
.countdown-wrap circle{ fill:none; stroke-width:10; stroke-linecap:round }
.countdown-wrap .bg{ stroke:#e2e8f0 }
.countdown-wrap .prog{ stroke:#0ea5e9; stroke-dasharray: 314; stroke-dashoffset:314 }
.count-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2.4rem; font-weight:800; color:#03224a }

/* greeting */
.greetings{ flex:1; min-width:260px }
.greetings h1{ margin:0; font-size:2rem; color:#03224a }
.greetings p.msg{ margin:10px 0 6px 0; font-weight:800; font-size:1.05rem; background: linear-gradient(90deg,#f97316,#a78bfa,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent }
.greetings .visit{ font-size:0.95rem; color:#0b2447 }

/* emojis container hidden until celebrate */
.emojis{ position:relative; width:100%; height:220px; pointer-events:none; display:none }
.emoji{
  position:absolute; font-size:30px; will-change:transform; display:inline-block; user-select:none;
  animation-iteration-count:infinite; animation-timing-function:linear; animation-direction:normal;
}

/* footer */
.footer{ text-align:center; font-weight:700; color:#ff4da6; position:fixed; left:0; right:0; bottom:18px; display:none }

/* bubbles (background) */
.bubble{ position:absolute; bottom:-120px; border-radius:50%; background:rgba(255,255,255,0.45); opacity:0.85 }

/* reveal classes when finished */
body.celebrate{ background: linear-gradient(to bottom, var(--bhagwa-start), var(--bhagwa-end)); }
body.celebrate .top-datetime, body.celebrate .emojis, body.celebrate .footer, body.celebrate .greetings .visit { display:block }

/* emoji across animation - we'll set duration via inline style */
@keyframes acrossX{
  0%{ transform: translateX(0) translateY(0) rotate(0deg) }
  25%{ transform: translateX(20vw) translateY(-8vh) rotate(15deg) }
  50%{ transform: translateX(-5vw) translateY(-18vh) rotate(-20deg) }
  75%{ transform: translateX(30vw) translateY(-10vh) rotate(10deg) }
  100%{ transform: translateX(0) translateY(0) rotate(0deg) }
}

/* responsive */
@media (max-width:640px){ .main-grid{flex-direction:column; align-items:center} .emoji{font-size:26px} }

  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="card" id="card">
      <div class="top-datetime" id="topDatetime">
        <div class="date" id="dateText"></div>
        <div class="time" id="timeText"></div>
      </div><div class="main-grid">
    <div style="flex-basis:200px; display:flex; justify-content:center; align-items:center;">
      <div class="countdown-wrap">
        <svg viewBox="0 0 120 120">
          <circle class="bg" cx="60" cy="60" r="50"></circle>
          <circle class="prog" cx="60" cy="60" r="50"></circle>
        </svg>
        <div class="count-num" id="countNum">5</div>
      </div>
    </div>

    <div class="greetings">
      <h1>Happy Birthday, Gaurav Bhai! 🎉</h1>
      <p class="msg">[  मै विशाल तिवारी आज के शुभ दिन के अवसर पर स्वागत करता हु आज के खास दिन पर  मेरी तरफ से ढेर सारा उपहार ! ]</p>
      <div class="visit" id="visitDate" style="display:none">Visit date: <b>28 September 2025</b></div>
    </div>
  </div>

  <div class="emojis" id="emojisArea"></div>
</div>

  </div>  <div class="footer" id="footer">[ पार्टी के देने के लिए अपने दोस्त से मिले🙃😊 ]</div>  <script>
    // ----- setup -----
    const prog = document.querySelector('.prog');
    const radius = 50;
    const circumference = 2 * Math.PI * radius;
    prog.style.strokeDasharray = circumference;
    prog.style.strokeDashoffset = circumference;

    const countEl = document.getElementById('countNum');
    const visitDateEl = document.getElementById('visitDate');

    // Live datetime updater (India)
    function updateDateTime(){
      const now = new Date();
      const optsDate = { year:'numeric', month:'long', day:'numeric', timeZone:'Asia/Kolkata' };
      const optsTime = { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false, timeZone:'Asia/Kolkata' };
      document.getElementById('dateText').textContent = now.toLocaleDateString('hi-IN', optsDate);
      document.getElementById('timeText').textContent = now.toLocaleTimeString('hi-IN', optsTime);
    }
    // keep updating in background (but hidden until celebrate)
    setInterval(updateDateTime, 500);
    updateDateTime();

    // ----- countdown + synced circular animation for exactly 5s -----
    const TOTAL_MS = 5000;
    let start = null;

    function animateCountdown(ts){
      if (!start) start = ts;
      const elapsed = ts - start;
      const t = Math.min(elapsed / TOTAL_MS, 1); // 0..1
      // circle progress (from 0 -> full)
      const offset = circumference * (1 - t);
      prog.style.strokeDashoffset = offset;

      // numeric display: show 5..1 each second
      const remaining = Math.max(0, 5 - Math.floor(t * 5));
      countEl.textContent = remaining;

      if (t < 1) {
        requestAnimationFrame(animateCountdown);
      } else {
        // finish
        countEl.textContent = 0;
        finishSequence();
      }
    }

    // start animation when DOM content is ready
    window.addEventListener('load', ()=>{
      requestAnimationFrame(animateCountdown);
    });

    // ----- after countdown finishes -----
    function finishSequence(){
      // background to bhagwa
      document.body.classList.add('celebrate');

      // reveal visit date and top datetime and footer
      document.getElementById('visitDate').style.display = 'block';
      document.getElementById('topDatetime').style.display = 'block';
      document.getElementById('footer').style.display = 'block';

      // create floating emojis across the area
      launchEmojis();

      // increase bubble visibility / continue background bubbles
      ensureBubbles();
    }

    // emojis behavior
    function launchEmojis(){
      const emojis = ["🎂","💐","🥳","🧁","🎊","🎉","🎶","🎵","🎺","👑","🎊","💌","🕯️","🧡","🌞","🌷"];
      const area = document.getElementById('emojisArea');
      area.style.display = 'block';
      // create many emojis with random positions and speeds
      for(let i=0;i<18;i++){
        const s = document.createElement('span');
        s.className = 'emoji';
        s.textContent = emojis[i % emojis.length];
        // random start position inside card
        const left = Math.random()*80 + 5; // %
        const top = Math.random()*60 + 10; // %
        s.style.left = left + '%';
        s.style.top = top + '%';
        // random duration and timing
        const dur = 3 + Math.random()*6;
        s.style.animationName = 'acrossX';
        s.style.animationDuration = dur + 's';
        s.style.animationTimingFunction = 'ease-in-out';
        s.style.animationIterationCount = 'infinite';
        s.style.opacity = 0.95;
        area.appendChild(s);
      }
    }

    // bubbles background (continuous)
    function ensureBubbles(){
      // if bubbles already present, do nothing
      if(document.querySelectorAll('.bubble').length) return;
      for(let i=0;i<16;i++){
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = 18 + Math.random()*90;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.random()*100 + '%';
        b.style.animationDuration = (6 + Math.random()*10) + 's';
        b.style.opacity = (0.25 + Math.random()*0.6).toFixed(2);
        document.body.appendChild(b);
      }
    }

    // In case user re-opens or wants immediate celebration if date matches -- optional
    // (We keep it simple: the animation always runs on page load)
  </script></body>
</html>
